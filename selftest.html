<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file: 'unsafe-inline'; style-src file: 'unsafe-inline'; img-src 'self' file: data: blob:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>墨息 · 自检 (selftest)</title>
  <style>
    body { margin: 0; background: #efeae0; font: 14px/1.6 -apple-system, "PingFang SC", system-ui, sans-serif; color: #2a241e; }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #panel {
      position: fixed; inset: 24px; overflow: auto;
      background: rgba(255,255,255,0.94); border-radius: 14px; padding: 20px 24px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.18);
    }
    h1 { margin: 0 0 4px; font-size: 17px; }
    .sub { color: #6b6257; margin: 0 0 16px; font-size: 13px; }
    ul { list-style: none; padding: 0; margin: 0 0 14px; }
    li { padding: 7px 10px; border-radius: 8px; margin-bottom: 6px; display: flex; gap: 10px; align-items: baseline; }
    li.pass { background: #eef6ef; }
    li.fail { background: #fbeae9; }
    .mark { font-weight: 700; }
    .pass .mark { color: #2e6e52; }
    .fail .mark { color: #c8372d; }
    .detail { color: #8a8075; font-size: 12px; margin-left: auto; font-family: ui-monospace, monospace; }
    #summary { font-weight: 700; font-size: 15px; margin-bottom: 10px; }
    code { background: #f0ece4; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
    .note { margin-top: 14px; padding-top: 12px; border-top: 1px solid #e3ddd2; color: #6b6257; font-size: 12.5px; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <canvas id="sand-stage" style="position:fixed;left:-9999px;top:-9999px;width:1px;height:1px" aria-hidden="true"></canvas>
  <div id="panel">
    <h1>墨息 · 自检</h1>
    <p class="sub">自动化检查渲染管线与「打断 / 让位」规则。全绿即说明引擎与交互都活着。</p>
    <div id="summary">运行中…</div>
    <ul id="list"></ul>
    <div class="note">
      这份自检只覆盖「能不能跑、规则对不对」。<br />
      <strong>是否真的离线</strong>请用另一招：断开 Wi‑Fi（或 DevTools → Network → 勾 Offline），
      再打开 <code>index.html</code> 落笔 —— 仍能洇墨、仍能存图，就是离线成立。<br />
      <strong>墨好不好看</strong>只能你自己看：打开 <code>index.html</code> 画两笔。
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="lib/suminagashi.js"></script>
  <script src="lib/sandsim.js"></script>
  <script src="src/sound.js"></script>
  <script src="src/movie.js"></script>
  <script src="src/app.js"></script>
  <script>
  (function () {
    'use strict'
    const list = document.getElementById('list')
    const summary = document.getElementById('summary')
    const results = []

    function check(name, ok, detail) {
      results.push({ name, ok: !!ok, detail: detail == null ? '' : String(detail) })
    }

    // 把 WebGL 画布缩绘到 2D 画布，统计“比宣纸明显更深”的像素比例。
    // 宣纸亮度约 234，墨会显著压暗 → 阈值取 200。
    function inkFraction() {
      const gl = window.__ink.engine.renderer.domElement
      const c = document.createElement('canvas')
      c.width = 240; c.height = 160
      const ctx = c.getContext('2d')
      ctx.drawImage(gl, 0, 0, c.width, c.height)
      const d = ctx.getImageData(0, 0, c.width, c.height).data
      let dark = 0
      for (let i = 0; i < d.length; i += 4) {
        const lum = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114
        if (lum < 200) dark++
      }
      return dark / (d.length / 4)
    }

    function pump(n) { // 推进模拟若干步并渲染
      const e = window.__ink.engine
      for (let i = 0; i < n; i++) e.step(0.016)
      e.render(performance.now())
    }

    function nextFrame() {
      return new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)))
    }

    async function main() {
      await nextFrame()

      // 1) 依赖与实例化
      check('three.js 已本地加载', !!window.THREE, window.THREE && ('r' + window.THREE.REVISION))
      check('水墨引擎已本地加载', !!window.Suminagashi)

      // 主动尝试一次引擎实例化，捕获具体错误信息用于诊断
      let initError = ''
      let initOk = false
      if (window.Suminagashi) {
        const probe = document.createElement('canvas')
        probe.width = 128; probe.height = 128
        try {
          const e = new window.Suminagashi(probe)
          e.dispose && e.dispose()
          initOk = true
        } catch (e) {
          initError = String(e && e.message || e)
        }
      }
      check('引擎实例化成功（WebGL 上下文可用）', initOk, initError)

      const hook = window.__ink
      if (!hook) { check('app.js 已加载', false, 'window.__ink 不存在'); render(); return }
      if (hook.initError) { check('app.js 初始化无异常', false, hook.initError); render(); return }
      check('app.js 已加载', true)

      if (!hook || !hook.engine) { render(); return }
      const engine = hook.engine
      const state = hook.state
      const aiTick = hook.aiTick

      // 像素测试期间先关掉 AI，避免它乱入影响测量
      state.aiOn = false

      // 2) 空白宣纸
      engine.clear(); pump(2)
      const blank = inkFraction()
      check('初始为空白宣纸（深像素占比 < 2%）', blank < 0.02, blank.toFixed(4))

      // 3) 落墨后画面应变深
      engine.strokeInk(0.5, 0.5, window.INKS.sumi, 2.0, 1, 0, 0.9)
      pump(20)
      const after = inkFraction()
      check('落墨后画面变深（墨确实渲染出来了）', after > blank + 0.003,
            blank.toFixed(4) + ' → ' + after.toFixed(4))

      // 4) 导出
      let url = ''
      try { url = engine.captureDataURL() } catch (e) { /* ignore */ }
      check('导出 PNG 可用', url.indexOf('data:image/png') === 0 && url.length > 5000,
            url ? (url.length / 1024).toFixed(0) + ' KB' : '失败')

      // 5) 让位规则（核心）：AI 现在每轮画一小段笔触，监听 strokeInk 的调用
      let drops = 0
      const orig = engine.strokeInk.bind(engine)
      engine.strokeInk = function () { drops++; return orig.apply(null, arguments) }

      state.aiOn = true
      const t1 = 1e12
      state.lastUserActivity = t1          // 用户刚刚落笔
      aiTick(t1)
      const whileActive = drops            // 期望 0

      const t2 = 1e12 + 1e6                // 时间推进到下一次 AI 周期
      state.lastUserActivity = t2 - 10000  // 用户已停笔 10 秒
      aiTick(t2)
      const whileIdle = drops - whileActive // 期望 >= 1（一小段笔触 = 若干节短划）

      engine.strokeInk = orig
      check('用户落笔时 AI 让位（不落新墨）', whileActive === 0, 'drops=' + whileActive)
      check('用户停笔后 AI 接手（画了一笔）', whileIdle >= 1, 'segs=' + whileIdle)

      // 6) AI 关掉后不再落墨
      state.aiOn = false
      drops = 0
      const orig2 = engine.strokeInk.bind(engine)
      engine.strokeInk = function () { drops++; return orig2.apply(null, arguments) }
      const t3 = 1e12 + 2e6
      state.lastUserActivity = t3 - 60000
      aiTick(t3)
      engine.strokeInk = orig2
      check('关掉 AI 同伴后不再落墨', drops === 0, 'drops=' + drops)

      // 7) 归零
      engine.clear(); pump(2)
      const cleared = inkFraction()
      check('归零后回到空白宣纸', cleared < 0.02, cleared.toFixed(4))

      // ── 沙盒断言（Mode A）──
      const SAND = window.SAND
      check('沙盒引擎已本地加载', !!window.SandSim)
      const sand = hook.sand
      check('沙盒实例化成功', !!sand)
      if (sand) {
        const S = SAND
        state.aiOn = false
        hook.setMode('sand')

        // a) 沙会下落
        sand.clear(); sand.place(0.5, 0.1, 'sand', 1, 1)
        const sTop0 = sand.cellAt(0.5, 0.1)
        for (let i = 0; i < 160; i++) sand.step(0.02)
        let sBot = false
        for (const yy of [0.9, 0.93, 0.96, 0.99]) if (sand.cellAt(0.5, yy) === S.SAND) sBot = true
        check('沙会往下落（顶空、底有沙）', sTop0 === S.SAND && sand.cellAt(0.5, 0.1) === S.EMPTY && sBot)

        // b) 水会找到地面
        sand.clear(); sand.place(0.5, 0.1, 'water', 1, 1)
        for (let i = 0; i < 220; i++) sand.step(0.02)
        let wBot = false
        { const lastRow = (sand.gridH - 1) * sand.gridW
          for (let x = 0; x < sand.gridW; x++) if (sand.type[lastRow + x] === S.WATER) wBot = true }
        check('水会找到地面', wBot)

        // c) 火会烧尽（无燃料，最终熄灭）
        sand.clear(); sand.place(0.5, 0.9, 'fire', 1, 1)
        for (let i = 0; i < 400; i++) sand.step(0.02)
        check('火会烧尽（最终无火）', sand.countOf(S.FIRE) === 0, 'fire=' + sand.countOf(S.FIRE))

        // d) 水浇灭火
        sand.clear(); sand.place(0.5, 0.85, 'fire', 2, 1)
        for (let i = 0; i < 20; i++) sand.step(0.02)
        sand.place(0.5, 0.5, 'water', 3, 1)
        for (let i = 0; i < 320; i++) sand.step(0.02)
        check('水浇灭火（火被灭）', sand.countOf(S.FIRE) === 0, 'fire=' + sand.countOf(S.FIRE))

        // e) 云会下雨（凝成水）
        sand.clear(); sand.place(0.5, 0.3, 'cloud', 3, 1)
        for (let i = 0; i < 600; i++) sand.step(0.02)
        check('云会下雨（凝成水）', sand.countOf(S.WATER) > 0, 'water=' + sand.countOf(S.WATER))

        // f) 炸弹会爆炸（引信到 → 爆心清空 + 环带起火，炸弹消失）
        sand.clear(); sand.place(0.5, 0.5, 'bomb', 1, 1)
        for (let i = 0; i < 230; i++) sand.step(0.02)
        check('炸弹引信到即爆（炸弹消失且环带起火）',
              sand.countOf(S.BOMB) === 0 && sand.countOf(S.FIRE) > 0,
              'bomb=' + sand.countOf(S.BOMB) + ' fire=' + sand.countOf(S.FIRE))

        // f2) 新元素：雪堆积、种子成植物、植物可燃、水火蒸汽、蒸汽凝水
        sand.clear(); sand.place(0.5, 0.1, 'snow', 3, 1)
        for (let i = 0; i < 300; i++) sand.step(0.02)
        check('雪会下落堆积', sand.countOf(S.SNOW) > 5, 'snow=' + sand.countOf(S.SNOW))

        sand.clear(); sand.place(0.5, 0.95, 'water', 6, 1)
        for (let i = 0; i < 30; i++) sand.step(0.02)
        sand.place(0.5, 0.8, 'seed', 4, 1)
        for (let i = 0; i < 400; i++) sand.step(0.02)
        const plantGrown = sand.countOf(S.PLANT)
        check('种子遇水发芽成植物（且生长有界）',
              plantGrown > 3 && plantGrown < sand.gridW * sand.gridH * 0.3,
              'plant=' + plantGrown)

        sand.clear(); sand.place(0.5, 0.9, 'plant', 6, 1)
        for (let i = 0; i < 50; i++) sand.step(0.02)
        const plantBefore = sand.countOf(S.PLANT)
        sand.place(0.5, 0.9, 'fire', 3, 1)
        for (let i = 0; i < 300; i++) sand.step(0.02)
        check('火点燃植物并蔓延烧掉大半', sand.countOf(S.PLANT) < plantBefore * 0.5,
              'before=' + plantBefore + ' after=' + sand.countOf(S.PLANT))

        sand.clear(); sand.place(0.5, 0.9, 'water', 5, 1)
        for (let i = 0; i < 30; i++) sand.step(0.02)
        sand.place(0.5, 0.985, 'fire', 3, 1)
        for (let i = 0; i < 40; i++) sand.step(0.02)
        const steamNow = sand.countOf(S.STEAM)
        for (let i = 0; i < 900; i++) sand.step(0.02)
        check('水遇火变蒸汽，蒸汽又凝回水（循环闭合）',
              steamNow > 0 && sand.countOf(S.STEAM) === 0 && sand.countOf(S.WATER) > 0,
              'steamNow=' + steamNow + ' steamEnd=' + sand.countOf(S.STEAM) + ' water=' + sand.countOf(S.WATER))

        // g) 归零（清空且 EMPTY 计数回到满格）—— 直接验证“归零”按钮的清除逻辑
        sand.clear()
        check('沙盒归零清空', sand.fullness() === 0 && sand.countOf(S.EMPTY) === sand.gridW * sand.gridH,
              'empty=' + sand.countOf(S.EMPTY) + '/' + (sand.gridW * sand.gridH))

        // h) 导出
        let surl = ''
        try { surl = sand.captureDataURL() } catch (e) {}
        check('沙盒导出 PNG 可用', typeof surl === 'string' && surl.indexOf('data:image/png') === 0)

        // i) 模式切换
        hook.setMode('sand')
        const sandOn = document.body.classList.contains('mode-sand') && state.mode === 'sand'
        hook.setMode('ink')
        const inkOn = !document.body.classList.contains('mode-sand') && state.mode === 'ink'
        check('模式切换生效（墨 ↔ 沙）', sandOn && inkOn)

        // j) 沙模式让位：用户刚动 → 不落沙
        let splace = 0
        const os = sand.place.bind(sand)
        sand.place = function () { splace++; return os.apply(null, arguments) }
        state.aiOn = true
        const t1 = 2e12
        state.lastUserActivity = t1
        hook.aiTick(t1)
        hook.advanceAiPour(t1)
        const wActive = splace
        sand.place = os
        check('沙模式下用户落笔 AI 让位（不落沙）', wActive === 0, 'places=' + wActive)

        // k) 沙模式接手：用户停笔 → 落沙
        let splace2 = 0
        const os2 = sand.place.bind(sand)
        sand.place = function () { splace2++; return os2.apply(null, arguments) }
        const t2 = 2e12 + 1e6
        state.lastUserActivity = t2 - 10000
        hook.aiTick(t2)
        for (let i = 0; i < 5; i++) hook.advanceAiPour(t2)
        sand.place = os2
        check('沙模式下用户停笔后 AI 接手（落沙）', splace2 >= 1, 'places=' + splace2)

        // l) 沙盒满了 AI 收手
        let splace3 = 0
        const os3 = sand.place.bind(sand)
        sand.place = function () { splace3++; return os3.apply(null, arguments) }
        let guard = 0
        while (sand.fullness() < 0.4 && guard < 3000) { sand.place(Math.random(), Math.random(), 'sand', 3, 1); guard++ }
        const t3 = 2e12 + 2e6
        state.lastUserActivity = t3 - 60000
        hook.aiTick(t3)
        hook.advanceAiPour(t3)
        sand.place = os3
        check('沙盒满了 AI 收手', splace3 === 0, 'places=' + splace3 + ' fullness=' + sand.fullness().toFixed(2))

        // m) 种子一致（确定性）
        const sa = new window.SandSim(document.createElement('canvas'), { seed: 999 })
        const sb = new window.SandSim(document.createElement('canvas'), { seed: 999 })
        sa.place(0.4, 0.3, 'sand', 2, 1); sb.place(0.4, 0.3, 'sand', 2, 1)
        sa.place(0.6, 0.4, 'water', 2, 1); sb.place(0.6, 0.4, 'water', 2, 1)
        for (let i = 0; i < 200; i++) { sa.step(0.02); sb.step(0.02) }
        let same = true
        for (let i = 0; i < sa.gridW * sa.gridH; i++) if (sa.type[i] !== sb.type[i]) { same = false; break }
        check('同种子结果一致', same)

        // n) C 键沉浸模式：隐藏 / 呼出工具栏
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'c' }))
        const hidBar = document.body.classList.contains('bar-hidden')
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'c' }))
        const showBar = !document.body.classList.contains('bar-hidden')
        check('按 C 隐藏 / 再按呼出工具栏（沉浸模式）', hidBar && showBar,
              'hide=' + hidBar + ' show=' + showBar)

        // n2) 「隐藏」按钮与 Esc 也能切换（快捷键不该是唯一入口）
        document.getElementById('hide').click()
        const byBtn = document.body.classList.contains('bar-hidden')
        window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape' }))
        const byEsc = !document.body.classList.contains('bar-hidden')
        check('「隐藏」按钮可隐藏、Esc 可呼出', byBtn && byEsc, 'btn=' + byBtn + ' esc=' + byEsc)

        // o) 精细创作模式：参数变细腻、AI 让位；切回后恢复
        const rBefore = hook.engine.config.SPLAT_RADIUS
        hook.setMode('fine')
        const fineOk = state.mode === 'fine' &&
              hook.engine.config.SPLAT_RADIUS < rBefore &&
              state.aiOn === false
        hook.setMode('ink')
        const backOk = state.mode === 'ink' &&
              hook.engine.config.SPLAT_RADIUS === rBefore &&
              state.aiOn === true
        check('精细模式：笔触参数变细 + AI 让位，切回恢复', fineOk && backOk,
              'fine=' + fineOk + ' back=' + backOk)

        // p) 精细模式下画笔必须走水墨引擎（回归测试：pointerAct 曾漏掉 fine）
        hook.setMode('fine')
        let fineStrokes = 0
        const origStroke = hook.engine.strokeInk.bind(hook.engine)
        hook.engine.strokeInk = function () { fineStrokes++; return origStroke.apply(null, arguments) }
        document.getElementById('stage')
          .dispatchEvent(new PointerEvent('pointerdown', { clientX: 300, clientY: 200, bubbles: true }))
        hook.engine.strokeInk = origStroke
        hook.setMode('ink')
        check('精细模式下落笔走水墨引擎（真实笔触）', fineStrokes >= 1, 'strokes=' + fineStrokes)

        // q) 墨转精保留画面（想新创作就用「归零」）
        engine.clear(); pump(2)
        engine.strokeInk(0.5, 0.5, window.INKS.sumi, 2.0, 1, 0, 0.9)
        pump(2)
        const inkBefore = inkFraction()
        hook.setMode('fine'); pump(4)
        const inkAfter = inkFraction()
        const kept = inkBefore > 0.003 && inkAfter >= inkBefore * 0.8 && inkAfter < inkBefore + 0.05
        hook.setMode('ink')
        check('墨转精保留画面（新创作按归零清空）', kept,
              'before=' + inkBefore.toFixed(4) + ' after=' + inkAfter.toFixed(4))

        // r) 环境音景（纯合成，无需真实音频输出即可验证 API 与状态切换）
        check('音景模块已加载', !!window.Soundscape)
        if (window.Soundscape) {
          const SS = window.Soundscape
          SS.setPreset('rain'); const r1 = SS.current()
          SS.setPreset('tide'); const r2 = SS.current()
          SS.setPreset('off'); const r3 = SS.current()
          SS.setVolume(0.4)
          check('音景可在 关 / 雨 / 潮 间切换', r1 === 'rain' && r2 === 'tide' && r3 === 'off',
                'rain=' + r1 + ' tide=' + r2 + ' off=' + r3)
        }

        // s) 短视频录制（离线、零网络；把创作过程重新定时到约 15 秒）
        check('录制模块已加载', !!window.Movie, window.Movie ? '' : '缺失')
        if (window.Movie) {
          const M = window.Movie
          const sup = M.supported()
          check('录制能力可被探测（真/假皆可，不崩溃）', typeof sup === 'boolean', 'supported=' + sup)
          const map = M._mapIndex
          check('时间映射：首帧=0、末帧=上限', map(0, 100) === 0 && map(449, 100) === 99,
                'f0=' + map(0, 100) + ' f449=' + map(449, 100))
          check('时间映射：N=1 恒为 0（避免除零）', map(200, 1) === 0, 'n1=' + map(200, 1))
          // 导出格式：MP4 必须排在 WebM 前面（最常见、相册/微信/iOS 直接认）
          const cands = M._candidates || []
          const iMp4 = cands.findIndex(function (m) { return m.indexOf('mp4') >= 0 })
          const iWebm = cands.findIndex(function (m) { return m.indexOf('webm') >= 0 })
          check('导出格式优先 MP4（MP4 排在 WebM 之前）', iMp4 >= 0 && iWebm > iMp4,
                'mp4@' + iMp4 + ' webm@' + iWebm)
          const pm = M._pickMime()
          check('首选格式可被解析（字符串或 null，不抛）',
                pm === null || typeof pm === 'string', 'pick=' + pm)
          // 采样与抽稀：源帧数必须够多（≥450 输出帧的倍数级），否则每帧被重复播放，
          // 成片就会「一帧一帧」。缓冲满时抽稀一半 + 间隔翻倍 → 内存有界、时长不受限。
          check('起始采样为满 30fps（源帧足够多，不会出现逐帧重复）',
                M._minInterval <= 33.4, 'minInterval=' + M._minInterval.toFixed(2) + 'ms')
          check('帧缓冲有上限（内存有界）',
                M._frameBudget >= 450 && M._frameBudget <= 2000, 'budget=' + M._frameBudget)
          const tf = M._thinFrames
          const many = []
          for (let i = 0; i < 1200; i++) many.push(i)
          const thin = tf(many)
          check('抽稀：长度约减半', thin.length > 550 && thin.length < 650, 'len=' + thin.length)
          check('抽稀：保留最早一帧（起点不丢）', thin[0] === 0, 'first=' + thin[0])
          check('抽稀：保留最新一帧（刚画完的状态不丢）',
                thin[thin.length - 1] === 1199, 'last=' + thin[thin.length - 1])
          check('抽稀：极短数组安全（不抛、不丢帧）',
                tf([7]).length === 1 && tf([7, 8]).length === 2 && tf([]).length === 0,
                'n1=' + tf([7]).length + ' n2=' + tf([7, 8]).length + ' n0=' + tf([]).length)
          // 采样率自适应：短录制满 30fps（源帧≈输出帧，画面顺滑），越久越稀，永不快于 30fps。
          // 固定低采样率会让每帧被重复播放多次 —— 成片看起来「一帧一帧」。
          const ci = M._captureInterval
          const ciBudget = M._frameBudget
          const ci0 = ci(0), ci1 = ci(1000), ci40 = ci(40000), ci120 = ci(120000)
          check('采样间隔：任何时候都不慢于 30fps（≤33.4ms）',
                ci0 <= 33.4 && ci1 <= 33.4 && ci40 <= 33.4,
                't0=' + ci0.toFixed(1) + ' t1s=' + ci1.toFixed(1) + ' t40s=' + ci40.toFixed(1))
          check('采样间隔：随时长单调变稀（长录制降为延时摄影）', ci40 < ci120,
                't40s=' + ci40.toFixed(1) + ' t120s=' + ci120.toFixed(1))
          check('采样间隔：总量收敛在帧预算内（120s 时 = 时长/预算）',
                Math.abs(ci120 - 120000 / ciBudget) < 0.001,
                't120s=' + ci120.toFixed(2) + ' budget=' + ciBudget)
          // 生命周期：start 进入录制态；stop 返回 Promise；空录制安全退出（await 保证计入结果）
          const r1 = M.start(function () { return document.createElement('canvas') })
          check('start 后处于录制态', M.isRecording() === true, 'ok=' + JSON.stringify(r1))
          const p2 = M.stop()
          check('stop 返回 Promise（不抛）', p2 && typeof p2.then === 'function', 'type=' + (p2 && typeof p2.then))
          await p2
          M.start(function () { return document.createElement('canvas') })
          const r3 = await M.stop()
          check('空录制安全退出（too-short，不崩溃）', r3 && r3.ok === false && r3.reason === 'too-short',
                'r=' + JSON.stringify(r3))
        }

        // s2) 录制按钮：必须真的绑定 handler，并且点击后产生**可观察的结果**。
        // 防的是「HTML 是新的、app.js 是旧的」这种半新半旧 —— 按钮看得见、点下去毫无反应。
        // 2026-10-02 真实踩到过：Service Worker cache-first 供了旧 app.js（见 issue #2）。
        // 判定标准（任一即可）：
        //   · 模块可用 → 点击后进入录制态（状态变化）
        //   · 模块不可用 → 点击后给出**明确的不支持提示**（文本变化），而不是静默
        //   · 两者都不成立 → 说明没有 handler，判定失败
        const movieBtn = document.getElementById('movie')
        if (!movieBtn) {
          check('点击录制按钮产生可观察反应（录制态或明确提示）', false, '#movie 按钮缺失')
        } else {
          const idleTxt = movieBtn.textContent
          const canRecord = !!(window.Movie && window.Movie.supported())
          movieBtn.click()
          let reacted, detail
          if (canRecord) {
            reacted = window.Movie.isRecording() === true
            detail = 'recording=' + window.Movie.isRecording()
          } else {
            reacted = movieBtn.textContent !== idleTxt
            detail = 'unsupportedMessage="' + movieBtn.textContent + '"'
          }
          check('点击录制按钮产生可观察反应（录制态或明确提示；无 handler 即失败）',
                reacted,
                'canRecord=' + canRecord + ' idle="' + idleTxt + '" ' + detail)
          if (window.Movie && window.Movie.isRecording()) await window.Movie.stop()
        }

        // t) PWA / 移动端：manifest 已声明、页面禁用下拉刷新、画布禁用触摸滚动
        check('PWA manifest 已链接', !!document.querySelector('link[rel="manifest"]'))
        check('浏览器支持 Service Worker（可安装为 PWA）', 'serviceWorker' in navigator)
        const ob = getComputedStyle(document.body).overscrollBehavior
        const ohtml = getComputedStyle(document.documentElement).overscrollBehavior
        check('页面禁用下拉刷新（overscroll-behavior: none）', ob === 'none' || ohtml === 'none',
              'body=' + ob + ' html=' + ohtml)
        check('画布禁用触摸滚动（touch-action: none）',
              getComputedStyle(document.getElementById('stage')).touchAction === 'none')

        state.aiOn = false
        hook.setMode('ink')
      }

      render()
    }

    function render() {
      const passed = results.filter((r) => r.ok).length
      const total = results.length
      const allOk = passed === total
      summary.textContent = allOk
        ? '全部通过 ' + passed + '/' + total
        : '通过 ' + passed + '/' + total + ' —— 有失败项，截图发我'
      summary.style.color = allOk ? '#2e6e52' : '#c8372d'
      list.innerHTML = results.map((r) => {
        // detail 可能来自异常消息，统一转义防注入
        const esc = (s) => String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]))
        return '<li class="' + (r.ok ? 'pass' : 'fail') + '">' +
        '<span class="mark">' + (r.ok ? 'PASS' : 'FAIL') + '</span>' +
        '<span>' + esc(r.name) + '</span>' +
        '<span class="detail">' + esc(r.detail) + '</span></li>'
      }).join('')
    }

    main().catch((e) => {
      summary.textContent = '自检崩溃：' + e.message
      summary.style.color = '#c8372d'
      console.error(e)
    })
  })()
  </script>
</body>
</html>
